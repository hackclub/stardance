        "422":
          description: Validation failed (e.g., no Hackatime projects linked).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /projects/{id}/posts/{post_id}:
