  /projects/{id}/mission:
    post:
      summary: Attach a mission to a project
      description: >-
        Attaches the given mission to the authenticated user's project.
        The user must own the project. Mission prerequisites must be met.
        If the project already has an active mission, it is swapped.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          description: Project ID.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mission_slug]
              properties:
                mission_slug:
                  type: string
                  description: Slug of the mission to attach.
      responses:
        "200":
          description: Mission attached.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_slug:
                    type: string
                  attached:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Prerequisites not met or mission not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Detach the active mission from a project
      description: Detaches the project's currently active mission. The user must own the project.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          description: Project ID.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mission detached.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  attached:
                    type: boolean
                    example: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Cannot detach (e.g. project already shipped to this mission).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{id}/mission_section_completions:
    get:
      summary: List mission section completions for a project
      description: Returns the completed guide steps for the project's currently active mission.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          description: Project ID.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of completed steps.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_slug:
                    type: string
                  completions:
                    type: array
                    items:
                      type: object
                      properties:
                        mission_step_id:
                          type: integer
                        title:
                          type: string
                        completed_at:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Project has no active mission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Mark a mission guide step complete
      description: >-
        Marks the given step complete for this project. Idempotent — calling it twice is safe.
        The project must be actively enrolled in the step's mission.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          description: Project ID.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mission_step_id]
              properties:
                mission_step_id:
                  type: integer
                  description: ID of the `Mission::Step` to mark complete.
      responses:
        "200":
          description: Step marked complete.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Step not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Project not enrolled in this mission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{id}/mission_section_completions/{step_id}:
    delete:
      summary: Unmark a mission guide step
      description: Removes the completion record for the given step. Idempotent.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          description: Project ID.
          required: true
          schema:
            type: integer
        - name: step_id
          in: path
          description: Mission step ID to unmark.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Step unmarked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                    example: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Step not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Project not enrolled in this mission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

