          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of the mission's projects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resources:
    get:
      summary: List resources
      description: Returns the full learning resources (guides) catalog and the category list. Not paginated.
      tags: [Resources]
      responses:
        "200":
          description: All resources, grouped by the category list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        label:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /resources/{id}:
    get:
      summary: Get a resource by slug
      description: Includes the fully-expanded related resources.
      tags: [Resources]
      parameters:
        - name: id
          in: path
          required: true
          description: The resource slug.
          schema:
            type: string
      responses:
        "200":
          description: The resource with its related resources.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Resource"
                  - type: object
                    properties:
                      related_resources:
                        type: array
                        items:
                          $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer YOUR_API_KEY`. Find or rotate your key in settings (bottom left on the Stardance website).

  headers:
    X-Request-ID:
      description: Unique ID for this request. Include it when reporting issues.
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string
      required: [error]

    ValidationError:
      type: object
      description: >-
        Returned when model validation fails. `request_id` is present on some paths but not all.
      properties:
        errors:
          type: array
          items:
            type: string
        request_id:
          type: string
          nullable: true
      required: [errors]

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        next_page:
          type: integer
          nullable: true
          description: Page number of the next page, or null on the last page.
      required: [current_page, total_pages, total_count, next_page]

    User:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        first_name:
          type: string
          nullable: true
          description: Only returned on `/users/me` (the key owner's own profile).
        last_name:
          type: string
          nullable: true
          description: Only returned on `/users/me` (the key owner's own profile).
        bio:
          type: string
          nullable: true
        verification_status:
          type: string
          enum: [needs_submission, pending, verified, ineligible]
          description: >-
            Whether the user has been verified for YSWS eligibility.
            `needs_submission` → user hasn't applied; `pending` → under review;
            `verified` → approved; `ineligible` → not eligible.
        avatar_url:
          type: string
          nullable: true
        banner_url:
          type: string
          nullable: true
          description: >-
            Relative path to the user's banner image. Prepend
            `https://stardance.hackclub.com` for a full URL. Null if no banner is set.
        balance:
          type: integer
          description: The user's current stardust balance. Only returned on `/users/me`.
        shop_region:
          type: string
          nullable: true
          description: Two-letter region code for shop availability and pricing. Only returned on `/users/me`.
        created_at:
          type: string
          format: date-time
        i_follow:
          type: boolean
          description: Whether the authenticated user follows this user.

    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        ship_status:
          type: string
          enum: [draft, submitted, under_review, approved, rejected]
          description: >-
            Lifecycle state of the project. `draft` → not yet submitted;
            `submitted` → awaiting review; `under_review` → being reviewed;
            `approved` → shipped; `rejected` → not approved.
        project_type:
          type: string
          nullable: true
          description: Free-form project type tag set by the owner.
        project_categories:
          type: array
          items:
            type: string
            enum:
              - CLI
              - Cargo
              - Web App
              - Chat Bot
              - Extension
              - Desktop App (Windows)
              - Desktop App (Linux)
              - Desktop App (macOS)
              - Minecraft Mods
              - Hardware
              - Android App
              - iOS App
              - Other
        repo_url:
          type: string
          nullable: true
        demo_url:
          type: string
          nullable: true
        readme_url:
          type: string
          nullable: true
        ai_declaration:
          type: string
          nullable: true
          description: How much AI was used in building this project (free text).
        devlogs_count:
          type: integer
        duration_seconds:
          type: integer
          description: Total Hackatime-logged seconds across all devlogs.
        devlog_ids:
          type: array
          items:
            type: integer
        banner_url:
          type: string
          nullable: true
          description: >-
            Relative path to the project banner image. Prepend
            `https://stardance.hackclub.com` for a full URL.
        shipped_at:
          type: string
          format: date-time
          nullable: true
          description: When the project was first submitted for review.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        i_follow:
          type: boolean
          description: Whether the authenticated user follows this project.

    Devlog:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
          description: Markdown content of the devlog entry.
        duration_seconds:
          type: integer
          nullable: true
          description: Hackatime-logged seconds that this devlog consumed.
        likes_count:
          type: integer
        comments_count:
          type: integer
        tutorial:
          type: boolean
        project_id:
          type: integer
          nullable: true
        media:
          type: array
          description: >-
            Attached images/files. `url` is a relative path. Prepend
            `https://stardance.hackclub.com` for a full URL.
          items:
            type: object
            properties:
              url:
                type: string
              content_type:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Post:
      type: object
      description: A post can be either a devlog, a ship event, or a repost.
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [devlog, ship_event, repost]
          description: The type of post.
        project_id:
          type: integer
        user_id:
          type: integer
        content:
          type: object
          description: Content varies by post type.
          oneOf:
            - $ref: "#/components/schemas/Post_Devlog_Content"
            - $ref: "#/components/schemas/Post_ShipEvent_Content"
            - $ref: "#/components/schemas/Post_Repost_Content"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Post_Devlog_Content:
      type: object
      properties:
        body:
          type: string
          description: Markdown content of the devlog.
        duration_seconds:
          type: integer
          nullable: true
        likes_count:
          type: integer
        comments_count:
          type: integer
        tutorial:
          type: boolean
        i_liked:
          type: boolean
          description: Whether the authenticated user has liked this post.
        media:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              content_type:
                type: string

    Post_ShipEvent_Content:
      type: object
      properties:
        certification_status:
          type: string
          enum: [pending, approved, rejected]
        body:
          type: string
          nullable: true
        feedback_reason:
          type: string
          nullable: true
        hours:
          type: number
        payout:
          type: integer
          nullable: true

    Post_Repost_Content:
      type: object
      properties:
        body:
          type: string
          nullable: true
          description: Optional quote comment added by the reposter.
        original_post_id:
          type: integer
          description: ID of the original Post that was reposted.
        original_post:
          type: object
          nullable: true
          description: Embedded original post data for rendering quote cards without a second request.
          properties:
            id:
              type: integer
            type:
              type: string
              enum: [devlog]
            user_id:
              type: integer
            created_at:
              type: string
              format: date-time
            content:
              type: object
              properties:
                body:
                  type: string
                likes_count:
                  type: integer
                comments_count:
                  type: integer
                duration_seconds:
                  type: integer

    Comment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time

    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
          description: Signed stardust amount — positive for earnings, negative for spending.
        reason:
          type: string
          description: Human-readable description of the transaction.
        created_at:
          type: string
          format: date-time

    SemanticResult:
      type: object
      properties:
        type:
          type: string
          enum: [project, devlog, ship, user]
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
          description: Short excerpt from the document content.

    WishlistEntry:
      type: object
      description: A wishlisted shop item with the timestamp the user added it.
      properties:
        wishlisted_at:
          type: string
          format: date-time
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        stardust_cost:
          type: integer
          description: Cost in stardust.
        one_per_person_ever:
          type: boolean
        limited:
          type: boolean
        available:
          type: boolean
          description: Whether this item is available in the user's region.
        available_regions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        image_url:
          type: string
          nullable: true

    ShopItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        stardust_cost:
          type: integer
          description: Cost in stardust.
        one_per_person_ever:
          type: boolean
          description: If true, can only be purchased once per user.
        limited:
          type: boolean
          description: If true, item has limited stock.
        available:
          type: boolean
          description: Whether this item is available in the user's region.
        available_regions:
          type: array
          items:
            type: string
          description: List of region codes where item is available.
        categories:
          type: array
          items:
            type: string
          description: Category slugs this item belongs to.
        image_url:
          type: string
          nullable: true
          description: Relative path to item image.
        created_at:
          type: string
          format: date-time

    ShopOrder:
      type: object
      properties:
        id:
          type: integer
        aasm_state:
          type: string
          enum: [pending, approved, rejected, on_hold, fulfilled, cancelled]
          description: Current state of the order.
        quantity:
          type: integer
        frozen_item_price:
          type: integer
          description: Price paid per item.
        rejection_reason:
          type: string
          nullable: true
          description: Reason if order was rejected.
        tracking_number:
          type: string
          nullable: true
          description: Shipping tracking number.
        fulfilled_at:
          type: string
          format: date-time
          nullable: true
        item:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            image_url:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Mission:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        difficulty:
          type: string
          nullable: true
          enum: [beginner, intermediate, advanced]
        estimated_completion_minutes:
          type: integer
          nullable: true
        steps_count:
          type: integer
        prizes_count:
          type: integer
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        featured_at:
          type: string
          format: date-time
          nullable: true
        achievement_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, upcoming, ended, draft]
          description: Which bucket the mission falls into right now.
        available:
          type: boolean
          description: Whether the mission can be started right now (started and not ended).
        icon_url:
          type: string
          nullable: true
          description: Relative path to the mission icon.
        banner_url:
          type: string
          nullable: true
          description: Relative path to the mission banner.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MissionStep:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        position:
          type: integer

    MissionPrize:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        shop_item:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            image_url:
              type: string
              nullable: true

    Resource:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        category_label:
          type: string
        icon:
          type: string
        reading_minutes:
          type: integer
        related:
          type: array
          items:
            type: string
          description: Slugs of related resources.

    LeaderboardEntry_Balance:
      type: object
      properties:
        rank:
          type: integer
          description: Position in the leaderboard (1-based).
        id:
          type: integer
        display_name:
          type: string
        avatar_url:
          type: string
        balance:
          type: integer
          description: Current stardust balance.

    LeaderboardEntry_TotalEarned:
      type: object
      properties:
        rank:
          type: integer
          description: Position in the leaderboard (1-based).
        id:
          type: integer
        display_name:
          type: string
        avatar_url:
          type: string
        total_earned:
          type: integer
          description: All-time stardust earned.

    AchievementEntry:
      type: object
      description: An achievement as seen by the authenticated user (includes unearned ones).
      properties:
        slug:
          type: string
          nullable: true
          description: Achievement slug. Null for secret achievements that haven't been earned yet.
        name:
          type: string
          description: Display name. Secret unearned achievements show `"???"`.
        description:
          type: string
          nullable: true
          description: Description text. Secret unearned achievements show the secret hint or null.
        icon:
          type: string
          description: Icon identifier.
        earned:
          type: boolean
        earned_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: object
          nullable: true
          description: >-
            Present for achievements with incremental progress that haven't been earned yet.
            Null once earned or for achievements without progress tracking.
          properties:
            current:
              type: integer
            target:
              type: integer
        stardust_reward:
          type: integer
          nullable: true
          description: Stardust reward for earning this achievement. Null for secret unearned achievements.

    EarnedAchievement:
      type: object
      description: An achievement earned by a user (public view — always earned).
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        earned_at:
          type: string
          format: date-time

  parameters:
    Limit:
      name: limit
      in: query
      description: Results per page (1–100, default 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Page:
      name: page
      in: query
      description: Page number (1-based, default 1).
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Invalid API key"
            request_id: "abc123"

    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Resource not found"
            request_id: "abc123"

    Forbidden:
      description: You do not have permission to perform this action.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidLimit:
      description: >-
        `limit` query parameter is outside the allowed range (1–100).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Limit must be between 1 and 100"
            request_id: "abc123"
