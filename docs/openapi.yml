---
openapi: 3.0.3
info:
  title: Stardance API
  version: v1
  description: |
    this built-in scalar theme looks cool, doesnt it? like... kind space y....

    ## Authentication

    Every endpoint requires an API key. Send it as a Bearer token:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    Open **Settings** from the sidebar to generate or rotate your key and replace `YOUR_API_KEY` with your generated one.

    **For endpoints that accept a request body, set `Content-Type: application/json`! Otherwise the body won't be parsed.**

    ---

    ## Rate limiting

    50 requests per 1 minute, enforced per IP address and per API key. Exceeding either limit returns `429 Too Many Requests` with body `{ "error": "rate_limited" }`.

    ---

    ## Pagination

    Paginated endpoints (eg. projects and devlogs) accept `?page` (1-based, default 1) and `?limit` (1–100, default 100). A `400` is returned if `limit` is out of that range. Responses include a `pagination` object:

    ```json
    {
      "current_page": 1,
      "total_pages": 4,
      "total_count": 312,
      "next_page": 2
    }
    ```

    `next_page` is `null` on the last page.

    ---

    ## Media URLs

    `media[].url` and `banner_url` are **relative paths** (e.g. `/rails/active_storage/blobs/…`). Prepend the server base URL (`https://stardance.hackclub.com`) to get a working url.

servers:
  - url: https://stardance.hackclub.com/api/v1
    description: Production server.

security:
  - bearerAuth: []

tags:
  - name: Search
    description: Endpoints for searching users, projects, posts, and shop items with filters.
  - name: Me
    description: Endpoints for the authenticated user's profile, projects, feed, orders, and achievements.
  - name: Users
    description: Endpoints for viewing other users' profiles, content, and earned achievements.
  - name: Projects
    description: Endpoints for viewing and managing projects and their posts.
  - name: Posts
    description: Endpoints for interacting with posts -- likes and reposts.
  - name: Shop
    description: Endpoints for browsing shop items and viewing orders.
  - name: Missions
    description: Endpoints for browsing missions, their steps, and prizes.
  - name: Resources
    description: Endpoints for browsing the learning resources (guides) catalog.
  - name: Leaderboard
    description: Stardust leaderboard — top users by current balance and all-time earned.

paths:
  /search/semantic:
    get:
      summary: Semantic search
      description: >-
        Vector-based semantic search across projects, devlogs, ships, and users.
        Returns up to 50 results merged from all types, ranked by relevance.
        Returns `503` if semantic search is not configured on the server (requires Redis + OpenAI).
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max results to return (1–50, default 20).
          schema:
            type: integer
      responses:
        "200":
          description: Semantic search results.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SemanticResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Semantic search not available (Redis or OpenAI not configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /search:
    get:
      summary: Search
      description: Search for users, projects, devlogs/ships, or shop items. The `type` parameter controls which resource is searched for and the format of the results.
      tags: [Search]
      parameters:
        - name: q
          in: query
          description: Search query string.
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Resource type to search for.
          required: true
          schema:
            type: string
            enum: [user, project, post, shop_item]
        - name: project_id
          in: query
          description: Filter posts by project (only for type=post).
          required: false
          schema:
            type: integer
        - name: author_id
          in: query
          description: Filter by author user ID (for type=project or type=post).
          required: false
          schema:
            type: integer
        - name: ship_status
          in: query
          description: Filter projects by ship status (only for type=project).
          required: false
          schema:
            type: string
            enum: [draft, submitted, under_review, approved, rejected]
        - name: project_type
          in: query
          description: Filter projects by project type (only for type=project).
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category (for type=project or type=shop_item).
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: Sort field (only for type=project). Defaults to `created_at`.
          required: false
          schema:
            type: string
            enum: [created_at, devlogs_count, duration_seconds, shipped_at]
        - name: sort_dir
          in: query
          description: Sort direction (only for type=project). Defaults to `desc`.
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Search results (format depends on type parameter).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      posts:
                        type: array
                        items:
                          $ref: "#/components/schemas/Devlog"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      shop_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ShopItem"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "400":
          description: Invalid search type or limit parameter.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /leaderboard:
    get:
      summary: Get the stardust leaderboard
      description: >-
        Returns the top 100 users ranked by current stardust balance and by all-time stardust earned.
        Only users who have opted in to leaderboard visibility are included.
        Also returns the authenticated user's rank in each category.
      tags: [Leaderboard]
      responses:
        "200":
          description: Leaderboard data.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_balance:
                    type: array
                    description: Top users by current stardust balance, descending.
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry_Balance"
                  by_total_earned:
                    type: array
                    description: Top users by all-time stardust earned, descending.
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry_TotalEarned"
                  my_rank:
                    type: object
                    description: The authenticated user's rank in each category.
                    properties:
                      balance:
                        type: integer
                        description: Position in the balance leaderboard (1-based).
                      total_earned:
                        type: integer
                        description: Position in the total-earned leaderboard (1-based).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      summary: Get the authenticated user's profile
      description: Provides info like display name, bio and avatar. Same as `/users/{id}` but for the profile of the key owner.
      tags: [Me]
      responses:
        "200":
          description: The current user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update the authenticated user's profile
      description: >-
        To upload a banner, send the request as `multipart/form-data`.
        For text-only updates, `application/json` also works.
        Pass `remove_banner=1` to delete the current banner.
      tags: [Me]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                bio:
                  type: string
                banner:
                  type: string
                  format: binary
                  description: Banner image file (PNG, JPEG, WebP, or GIF; max 8 MB).
                remove_banner:
                  type: string
                  enum: ["1"]
                  description: Pass `"1"` to delete the current banner.
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: The updated user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation failed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /users/{id}:
    get:
      summary: Get a user's profile
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/projects:
    get:
      summary: List a user's projects
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of the user's projects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/posts:
    get:
      summary: List a user's posts (devlogs, ships, and reposts)
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of the user's posts.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/projects:
    get:
      summary: List the authenticated user's projects
      tags: [Me]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of the current user's projects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a new project
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                repo_url:
                  type: string
                  nullable: true
                demo_url:
                  type: string
                  nullable: true
                readme_url:
                  type: string
                  nullable: true
                ai_declaration:
                  type: string
                  nullable: true
              required: [title]
      responses:
        "201":
          description: The newly created project.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation failed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /users/me/orders:
    get:
      summary: List current user's shop orders
      tags: [Me]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of the user's shop orders.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShopOrder"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/orders/{id}:
    get:
      summary: Get a specific shop order
      tags: [Me]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The shop order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/recommended_projects:
    get:
      summary: Get recommended projects
      description: >-
        Up to 6 projects recommended for the user.
      tags: [Me]
      responses:
        "200":
          description: List of recommended projects (up to 6, no pagination).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/feed:
    get:
      summary: Get feed
      description: >-
        Paginated feed of recent posts (devlogs, ship events, and reposts). Mirrors what you see on `/home`.
        Personalized via Gorse recommendations when available, with a quality-ranked SQL fallback.
      tags: [Me]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of posts.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/achievements:
    get:
      summary: List the authenticated user's achievements
      description: >-
        Returns all achievements visible to the authenticated user — earned and unearned.
        Secret achievements appear as `"???"` until earned. Hidden achievements only appear once earned.
        Includes `progress` for achievements that track incremental progress (e.g. referrals).
        Does **not** trigger any achievement checks or awards.
      tags: [Me]
      responses:
        "200":
          description: Achievement list with progress and summary stats.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievements:
                    type: array
                    items:
                      $ref: "#/components/schemas/AchievementEntry"
                  stats:
                    type: object
                    properties:
                      earned:
                        type: integer
                        description: Number of countable achievements earned by the user.
                      total:
                        type: integer
                        description: Total number of countable achievements available.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/wishlist:
    get:
      summary: List current user's wishlist
      description: Returns all shop items the authenticated user has wishlisted, ordered newest first.
      tags: [Me]
      responses:
        "200":
          description: List of wishlisted shop items.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlist:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishlistEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/wishlist/{id}:
    post:
      summary: Add item to wishlist
      description: Adds the given shop item to the authenticated user's wishlist. Idempotent — calling it twice has no extra effect.
      tags: [Me]
      parameters:
        - name: id
          in: path
          description: Shop item ID.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item wishlisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlisted:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove item from wishlist
      description: Removes the given shop item from the authenticated user's wishlist. Idempotent — no error if it wasn't wishlisted.
      tags: [Me]
      parameters:
        - name: id
          in: path
          description: Shop item ID.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item removed from wishlist.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlisted:
                    type: boolean
                    example: false
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/balance:
    get:
      summary: Get current user's stardust balance and ledger
      description: Returns the authenticated user's current stardust balance and paginated transaction history.
      tags: [Me]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Balance and ledger entries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  stardust_balance:
                    type: integer
                    description: Current stardust balance.
                  ledger:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/shop_region:
    patch:
      summary: Set current user's shop region
      description: Updates the authenticated user's shop region, which controls which shop items are marked as available.
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region]
              properties:
                region:
                  type: string
                  description: ISO-style region code (e.g. `US`, `EU`, `XX` for global).
      responses:
        "200":
          description: Region updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop_region:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Invalid region code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/find:
    get:
      summary: Find user by username
      description: >-
        Looks up a user by their display name (case-insensitive exact match).
        Returns the same shape as `GET /users/{id}`.
      tags: [Users]
      parameters:
        - name: username
          in: query
          required: true
          description: The user's display name.
          schema:
            type: string
      responses:
        "200":
          description: The user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/followers:
    get:
      summary: List a user's followers
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of followers.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/following:
    get:
      summary: List users that a user follows
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated list of followed users.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/achievements:
    get:
      summary: List a user's earned achievements
      description: >-
        Returns only the achievements that this user has earned. Secret achievement names and
        descriptions are shown in full here since the user has already earned them.
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
