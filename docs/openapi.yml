  /projects/{id}:
    get:
      summary: Get a project by ID
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The project.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a project
      description: >-
        Only the project author can update a project. 
        To upload a banner, send the request as `multipart/form-data`.
        For text-only updates, `application/json` also works.
        Pass `remove_banner=1` to delete the current banner.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                repo_url:
                  type: string
                demo_url:
                  type: string
                readme_url:
                  type: string
                ai_declaration:
                  type: string
                banner:
                  type: string
                  format: binary
                  description: Banner image file (JPEG, PNG, WebP, HEIC, or HEIF; max 10 MB).
                remove_banner:
                  type: string
                  enum: ["1"]
                  description: Pass `"1"` to delete the current banner.
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                repo_url:
                  type: string
                demo_url:
                  type: string
                readme_url:
                  type: string
                ai_declaration:
                  type: string
      responses:
        "200":
          description: The updated project.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation failed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /projects/{id}/posts:
    get:
      summary: List posts for a project
      description: Returns both devlogs and ship events.
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
