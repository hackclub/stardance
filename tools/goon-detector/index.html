<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movement detector</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,sans-serif; background:#080b13; color:#f5f6fc; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
  main { width:min(700px,100%); text-align:center; }
  h1 { font-size:clamp(30px,6vw,64px); letter-spacing:-.05em; }
  p { color:#bac2d8; }
  #score { font-size:clamp(80px,18vw,180px); font-weight:900; }
  progress { width:100%; height:18px; accent-color:#a5ffc8; }
  button { padding:16px 24px; margin:12px 5px; border:0; border-radius:12px; font:700 17px system-ui; cursor:pointer; background:#a5ffc8; color:#07130d; }
  button:disabled { opacity:.5; }
  #alert { position:fixed; inset:0; background:#d5ff70; color:#101506; padding:5vw; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:2; }
  #alert[hidden] { display:none; }
  #alert h2 { margin:0; font-size:clamp(48px,10vw,160px); line-height:1.03; letter-spacing:-.055em; max-width:1300px; }
  #alert button { background:#101506; color:#d5ff70; margin-top:40px; }
</style>
<main>
  <p>USB MOVEMENT DETECTOR</p>
  <h1>Suspicious activity monitor</h1>
  <div id="score">0%</div>
  <progress id="meter" max="100" value="0"></progress>
  <p id="status">Connecting…</p>
  <button id="arm">Arm detector + full screen</button>
  <button id="test" disabled>Test alert</button>
  <p id="hint">Triggers above 70%. Escape dismisses the alert. Audio plays once per alert.</p>
</main>
<section id="alert" hidden role="alert">
  <h2>gooning at work is crazy vro 🥀</h2>
  <button id="dismiss">Dismiss / stop audio</button>
</section>
<script>
const $ = id => document.getElementById(id);
let context, buffer, source, armed = false, seen = null;
const audioBytes = fetch('/jonkler-rap.mp3').then(r => {
  if (!r.ok) throw Error('Audio file unavailable');
  return r.arrayBuffer();
});
audioBytes.catch(() => {});
function dismiss() {
  $('alert').hidden = true;
  if (source) { source.stop(); source = null; }
}
function trigger() {
  if (!armed || !$('alert').hidden) return;
  $('alert').hidden = false;
  source = context.createBufferSource();
  source.buffer = buffer;
  source.connect(context.destination);
  source.start();
}
$('arm').onclick = async () => {
  $('arm').disabled = true;
  try {
    context ??= new (window.AudioContext || window.webkitAudioContext)();
    const resume = context.resume();
    const fullscreen = document.documentElement.requestFullscreen?.().catch(() => {});
    await resume;
    buffer ??= await context.decodeAudioData((await audioBytes).slice(0));
    await fullscreen;
    armed = true;
    $('arm').textContent = 'Armed — sound enabled';
    $('test').disabled = false;
    $('hint').textContent = 'Above 70% triggers an alert. Drop to 30% or lower to rearm. Escape stops audio.';
    if (Number($('meter').value) > 70) trigger();
  } catch (error) {
    $('hint').textContent = 'Could not enable audio: ' + error.message;
    $('arm').disabled = false;
  }
};
$('test').onclick = trigger;
$('dismiss').onclick = dismiss;
document.addEventListener('keydown', e => { if (e.key === 'Escape') dismiss(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) dismiss(); });
async function poll() {
  try {
    const response = await fetch('/state');
    if (!response.ok) throw Error('Disconnected');
    const data = await response.json();
    $('score').textContent = data.suspicion + '%';
    $('meter').value = data.suspicion;
    $('status').textContent = data.status;
    if (seen !== null && data.event !== seen && data.connected) trigger();
    seen = data.event;
  } catch (_) { $('status').textContent = 'Server disconnected. Relaunch Start.command.'; }
  setTimeout(poll, 100);
}
poll();
</script>
</html>
