openapi: 3.0.3
info:
  title: Stardance API
  version: "1"
  description: |
    A public API for reading and managing projects. You need an API key to
    use this! Go to your [account settings](/?settings=1) to get one.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Include your API key via `Authorization: Bearer YOUR_API_KEY`. You
        can find or regenerate your API key in your
        [account settings](/?settings=1).
  schemas:
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        ship_status: { type: string }
        repo_url: { type: string, nullable: true }
        demo_url: { type: string, nullable: true }
        readme_url: { type: string, nullable: true }
        ai_declaration: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        devlog_ids:
          type: array
          items: { type: integer }
        banner_url: { type: string, nullable: true }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        total_pages: { type: integer }
        total_count: { type: integer }
        next_page: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items: { type: string }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    page:
      name: page
      in: query
      required: false
      schema: { type: integer }
      description: Page number for pagination
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, maximum: 100 }
      description: Number of results per page (max 100)
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid API key" }
    NotFound:
      description: Project not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Resource not found" }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrors" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
          example: { error: "rate_limited", message: "Too many requests. Please slow down." }
paths:
  /projects:
    get:
      summary: List projects
      tags: [ Projects ]
      description: "Fetch a list of projects. Ratelimit: 5 reqs/min, 20 reqs/min if searching."
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Search projects by title or description
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Create a project
      tags: [ Projects ]
      description: Create a new project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title: { type: string, description: Project title }
                description: { type: string, description: Project description }
                demo_url: { type: string, description: URL to the live demo }
                repo_url: { type: string, description: URL to the source code repository }
                readme_url: { type: string, description: URL to the README }
                ai_declaration: { type: string, description: Declaration of AI tools used in this project }
              required: [ title ]
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get a project
      tags: [ Projects ]
      description: "Fetch a specific project by ID. Ratelimit: 30 reqs/min."
      operationId: getProject
      responses:
        "200":
          description: A single project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      summary: Update a project
      tags: [ Projects ]
      description: Update an existing project.
      operationId: updateProject
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title: { type: string, description: Project title }
                description: { type: string, description: Project description }
                demo_url: { type: string, description: URL to the live demo }
                repo_url: { type: string, description: URL to the source code repository }
                readme_url: { type: string, description: URL to the README }
                ai_declaration: { type: string, description: Declaration of AI tools used in this project }
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
